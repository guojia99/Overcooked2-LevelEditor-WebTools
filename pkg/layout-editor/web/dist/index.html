<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OC2 关卡编辑器</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <script>
      (function () {
        try {
          var v = localStorage.getItem("oc2-ui-theme");
          var t =
            v === "pink" || v === "sky-blue" || v === "white" ? v : "black-gold";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "black-gold";
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/main-ejW_PXNR.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/version-4an3e6dy.js">
    <link rel="stylesheet" crossorigin href="/assets/version-DyNbSqlK.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var path = location.pathname;
        var search = location.search;
        var hash = location.hash;
        if (path === "/index.html" || path.endsWith("/index.html")) {
          path = path.replace(/\/?index\.html$/, "") || "/";
          history.replaceState(null, "", path + search + hash);
        }
        if (hash.indexOf("#/") === 0) {
          history.replaceState(null, "", hash.slice(1) + search);
        }
      })();
    </script>
  </body>
</html>
